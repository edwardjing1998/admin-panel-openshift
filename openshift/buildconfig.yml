apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: admin-panel
  labels:
    app: admin-panel
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: admin-panel
  labels:
    app: admin-panel
spec:
  source:
    type: Binary

  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile

  output:
    to:
      kind: ImageStreamTag
      name: admin-panel:latest

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

  completionDeadlineSeconds: 1200
  triggers: []